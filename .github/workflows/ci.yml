name: ci

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/audit-svc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest --junitxml=python.junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: python.junit.xml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag and build date
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG=main_${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "SOURCE_DATE_EPOCH=1700000000" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          provenance: false
          sbom: false
          outputs: type=image,push=true,rewrite-timestamp=true
  
  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, deploy]
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        working-directory: deploy
        env:
          ANSIBLE_VAULT_KEY: ${{ secrets.ANSIBLE_VAULT_KEY }}
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook --vault-password-file ./vault-pass.sh audit-svc.play.yml -e release_tag=${GITHUB_REF_NAME}
