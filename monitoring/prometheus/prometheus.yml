global:
  scrape_interval: 15s        # как часто опрашивать цели
  evaluation_interval: 15s    # как часто вычислять правила

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: audit-svc
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx:8080"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]


