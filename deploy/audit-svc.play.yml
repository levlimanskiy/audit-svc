- name: Deploy audit-svc stack
  hosts: all
  tags: [deploy]

  module_defaults:
    community.postgresql.postgresql_ping:
      login_host: "{{ pg_cont.container.NetworkSettings.Networks[audit_net].IPAddress }}"
      login_port: 5432
      login_user: postgres
      login_password: "{{ pg_superuser_password }}"
    community.postgresql.postgresql_user:
      login_host: "{{ pg_cont.container.NetworkSettings.Networks[audit_net].IPAddress }}"
      login_port: 5432
      login_user: postgres
      login_password: "{{ pg_superuser_password }}"
    community.postgresql.postgresql_db:
      login_host: "{{ pg_cont.container.NetworkSettings.Networks[audit_net].IPAddress }}"
      login_port: 5432
      login_user: postgres
      login_password: "{{ pg_superuser_password }}"

  tasks:
    - name: Docker network
      community.docker.docker_network:
        name: "{{ audit_net }}"

    - name: Postgres data volume
      community.docker.docker_volume:
        name: "{{ pg_volume }}"

    - name: Postgres container
      community.docker.docker_container:
        name: "{{ pg_container }}"
        image: postgres:17
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ audit_net }}"
        volumes:
          - "{{ pg_volume }}:/var/lib/postgresql/data"
        published_ports: []
        env:
          POSTGRES_PASSWORD: "{{ pg_superuser_password }}"
      no_log: true
      register: pg_cont

    - name: Wait for Postgres
      community.postgresql.postgresql_ping:
      register: pg_ping
      until: pg_ping.is_available
      retries: 30
      delay: 2
      no_log: true

    - name: Role audit_svc
      community.postgresql.postgresql_user:
        name: "{{ pg_user }}"
        password: "{{ audit_svc_password }}"
      no_log: true

    - name: Database audit owned by audit_svc
      community.postgresql.postgresql_db:
        name: "{{ pg_db }}"
        owner: "{{ pg_user }}"
    
    - name: Config dir
      ansible.builtin.file:
        path: "{{ audit_cfg_dir }}"
        state: directory
        mode: "0750"

    - name: Service config
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ audit_cfg_dir }}/config.yaml"
        mode: "0640"
      no_log: true
      notify: Reload audit-svc

    - name: Run migrations
      community.docker.docker_container:
        name: audit-migrate
        image: "{{ audit_image }}:{{ release_tag }}"
        command: migrate
        detach: false
        cleanup: true
        user: "{{ ansible_facts.user_uid }}:{{ ansible_facts.user_gid }}"
        networks:
          - name: "{{ audit_net }}"
        volumes:
          - "{{ audit_cfg_dir }}:/etc/audit-svc:ro"
      register: migrate_result
      changed_when: false
      failed_when: migrate_result.status | default(0) != 0

    - name: Show migration log
      ansible.builtin.debug:
        msg: "{{ migrate_result.container.Output.splitlines() }}"

    - name: audit-svc container
      community.docker.docker_container:
        name: "{{ audit_container }}"
        image: "{{ audit_image }}:{{ release_tag }}"
        image_name_mismatch: ignore
        state: started
        restart_policy: unless-stopped
        user: "{{ ansible_facts.user_uid }}:{{ ansible_facts.user_gid }}"
        networks:
          - name: "{{ audit_net }}"
        volumes:
          - "{{ audit_cfg_dir }}:/etc/audit-svc:ro"

    - name: Nginx config dir
      ansible.builtin.file:
        path: "{{ audit_cfg_dir }}/nginx"
        state: directory
        mode: "0755"

    - name: Nginx config
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: "{{ audit_cfg_dir }}/nginx/default.conf"
        mode: "0644"
      notify: Reload nginx

    - name: Nginx container
      community.docker.docker_container:
        name: "{{ nginx_container }}"
        image: nginx:1.27
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ audit_net }}"
        volumes:
          - "{{ audit_cfg_dir }}/nginx:/etc/nginx/conf.d:ro"
        published_ports:
          - "127.0.0.1:{{ nginx_host_port }}:8080"

    - name: Nginx exporter
      community.docker.docker_container:
        name: "{{ exporter_container }}"
        image: nginx/nginx-prometheus-exporter:1.4
        command:
          - "--nginx.scrape-uri=http://{{ nginx_container }}:8081/stub_status"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ audit_net }}"
        published_ports:
          - "127.0.0.1:{{ exporter_host_port }}:9113"

  handlers:
    - name: Reload audit-svc
      community.docker.docker_container_exec:
        container: "{{ audit_container }}"
        argv:
          - python
          - -c
          - "import urllib.request as u; print(u.urlopen(u.Request('http://127.0.0.1:8080/reload', method='POST')).read())"
    
    - name: Reload nginx
      community.docker.docker_container_exec:
        container: "{{ nginx_container }}"
        argv: [nginx, -s, reload]